{% extends 'base.html' %}

{% block title %}Вход — Точка сборки{% endblock %}
{% block body_class %}forms-page{% endblock %}
{% block content %}
<h1 class="h3 fw-bold mb-4" id="page-title">Вход</h1>
<div class="site-form-panel">
    <form class="site-form" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include 'partials/form_fields.html' %}
        <button class="btn btn-primary form-action" type="submit">Войти</button>
        <p class="form-crosslink">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a></p>
    </form>
</div>
{% endblock %}
